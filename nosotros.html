<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Conecta Infancia</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            padding: 24px;
            min-height: 100vh;
            /* ✅ Degradado tricolor: verde claro → beige → azul oscuro */
            background: linear-gradient(
                180deg,
                #d5f0e3,
                #f5f0e6 50%,
                #1a3a5f
            );
            color: #1a3a5f;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 16px;
            margin-bottom: 28px;
        }

        .header-title {
            font-size: 2.3rem;
            font-weight: 700;
            color: #1b5e20;
            margin: 0;
        }

        .nav-buttons {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            justify-content: flex-end;
        }

        .nav-buttons a {
            text-decoration: none;
            padding: 9px 18px;
            background: rgba(255, 255, 255, 0.8);
            color: #1b5e20;
            border: 2px solid #4caf50;
            border-radius: 30px;
            font-weight: 600;
            font-size: 15px;
            transition: all 0.3s ease;
            box-shadow: 0 3px 7px rgba(0, 0, 0, 0.1);
            backdrop-filter: blur(6px);
        }

        .nav-buttons a:hover {
            background: white;
            transform: translateY(-2px);
            box-shadow: 0 6px 16px rgba(0, 0, 0, 0.15);
            border-color: #2196f3;
        }

        .canva-container {
            position: relative;
            width: 100%;
            height: 0;
            padding-top: 281.1127%;
            border-radius: 10px;
            overflow: hidden;
            margin: 20px 0 30px;
            box-shadow: 0 4px 12px rgba(26, 58, 95, 0.15);
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(2px);
        }

        .canva-container iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
        }

        .card-buttons {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 16px;
            padding: 10px;
        }

        .card {
            width: 150px;
            padding: 16px 10px;
            background: rgba(255, 255, 255, 0.85);
            border: 1px solid rgba(100, 181, 246, 0.3);
            border-radius: 16px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
            backdrop-filter: blur(4px);
            box-shadow: 0 3px 8px rgba(0, 0, 0, 0.08);
        }

        .card:hover {
            background: white;
            transform: translateY(-3px);
            box-shadow: 0 6px 16px rgba(0, 0, 0, 0.12);
            border-color: #4fc3f7;
        }

        .card i {
            font-size: 1.7rem;
            margin-bottom: 8px;
            color: #1565c0;
            display: block;
        }

        .card span {
            font-weight: 600;
            font-size: 0.95rem;
            color: #1a3a5f;
        }

        .credit {
            text-align: center;
            margin-top: 20px;
            color: #e0e0e0; /* claro sobre el azul oscuro */
            font-size: 0.9rem;
        }

        @media (max-width: 768px) {
            .header {
                flex-direction: column;
                align-items: flex-start;
            }
            .header-title {
                font-size: 2rem;
            }
            .nav-buttons {
                width: 100%;
                justify-content: center;
            }
        }
    </style>
</head>
<body>

    <div class="header">
        <h1 class="header-title">Conecta Infancia</h1>
        <div class="nav-buttons">
            <a href="index.html"><i class="fas fa-home"></i> Inicio</a>
            <a href="nosotros.html"><i class="fas fa-users"></i> Nosotros</a>
            <a href="reportaje.html"><i class="fas fa-film"></i> Reportaje</a>
            <a href="libros.html"><i class="fas fa-book"></i> Libros</a>
            <a href="recursos.html"><i class="fas fa-photo-video"></i> Recursos</a>
            <a href="contacto.html"><i class="fas fa-envelope"></i> Contacto</a>
        </div>
    </div>

    <div class="canva-container">
        <iframe loading="lazy"
                src="https://www.canva.com/design/DAG4BfzlN1c/JI0I6aHJuWYFLIqyDICKSg/view?embed"
                allowfullscreen
                allow="fullscreen">
        </iframe>
    </div>

    <div class="card-buttons">
        <div class="card" onclick="navigate('Inicio')">
            <i class="fas fa-home"></i>
            <span>Inicio</span>
        </div>
        <div class="card" onclick="navigate('Nosotros')">
            <i class="fas fa-users"></i>
            <span>Nosotros</span>
        </div>
        <div class="card" onclick="navigate('Reportaje')">
            <i class="fas fa-film"></i>
            <span>Reportaje</span>
        </div>
        <div class="card" onclick="navigate('Libros')">
            <i class="fas fa-book"></i>
            <span>Libros</span>
        </div>
        <div class="card" onclick="navigate('Recursos')">
            <i class="fas fa-photo-video"></i>
            <span>Recursos</span>
        </div>
        <div class="card" onclick="navigate('Contacto')">
            <i class="fas fa-envelope"></i>
            <span>Contacto</span>
        </div>
    </div>

    <p class="credit">© 2025 Conecta Infancia</p>

    <script>
        function navigate(section) {
            alert(`Navegando a: ${section}`);
        }
    </script>

</body>
</html>
