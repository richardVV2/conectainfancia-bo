<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lector de PDF</title>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      margin: 0;
      padding: 16px;
      background-color: #f9f6f0; /* ✅ Beige suave (como mencionaste) */
      color: #2d3748;
    }
    .container {
      max-width: 1000px;
      margin: 0 auto;
      background: white;
      padding: 24px;
      border-radius: 12px;
      box-shadow: 0 6px 20px rgba(0,0,0,0.07);
    }
    h1 {
      margin-top: 0;
      color: #1a202c;
    }
    iframe {
      width: 100%;
      height: 75vh;
      border: none;
      border-radius: 8px;
      display: block;
      background: #fafafa;
    }
    .btn {
      display: inline-block;
      margin-top: 20px;
      padding: 12px 28px;
      background-color: #1E3A8A; /* ✅ Azul oscuro elegante */
      color: white;
      text-decoration: none;
      border-radius: 8px;
      font-weight: 600;
      font-size: 16px;
      transition: all 0.25s ease;
      box-shadow: 0 2px 6px rgba(30, 58, 138, 0.3);
    }
    .btn:hover {
      background-color: #1E40AF;
      transform: translateY(-2px);
      box-shadow: 0 4px 8px rgba(30, 58, 138, 0.4);
    }
    @media (max-width: 600px) {
      .container { padding: 16px; }
      iframe { height: 65vh; }
      .btn { width: 100%; text-align: center; }
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Documento PDF</h1>
    <p>Haz clic abajo para descargar, o desplázate para leer en línea:</p>

    <!-- ✅ iframe con ID: 1OYCEhQtEfeTJBdM-2QeZDAa7VnqY3C49 -->
    <iframe 
      src="https://drive.google.com/file/d/1OYCEhQtEfeTJBdM-2QeZDAa7VnqY3C49/preview"
      title="Visor de PDF"
      sandbox="allow-scripts allow-same-origin allow-popups allow-forms"
    ></iframe>

    <!-- ✅ Descarga directa -->
    <a 
      href="https://drive.google.com/uc?export=download&id=1OYCEhQtEfeTJBdM-2QeZDAa7VnqY3C49"
      class="btn"
    >
      📥 Descargar PDF
    </a>
  </div>
</body>
</html>
