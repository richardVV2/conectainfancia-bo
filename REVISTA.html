    <!-- ✅ SCRIPT PARA QUE AMBOS GRUPOS DE BOTONES FUNCIONEN Y AGREGAR SONIDO AL PASAR PÁGINAS -->
    <script>
    $(document).ready(function() {
        // Crear elemento de audio para el sonido de pasar página
        const pageSound = new Audio();
        
        // Usar un sonido de página simple (puedes reemplazarlo con un archivo real)
        // Este es un sonido base64 simple de papel - reemplázalo con tu archivo de sonido**********************************ojo
        pageSound.src = "assets/sounds/sword.mp3";
        
        // Si tienes un archivo de sonido real, usa esta línea en su lugar:
        // pageSound.src = "assets/sounds/page-flip.mp3";
        
        // Configurar volumen
        pageSound.volume = 0.3;
        
        // Función para reproducir sonido de página
        function playPageSound() {
            pageSound.currentTime = 0;
            pageSound.play().catch(e => console.log("Error reproduciendo sonido de página:", e));
        }
        
        // Detectar cambio de página en la revista
        $('#slider').on('turn', function(event, page, view) {
            playPageSound();
        });
        
        // Función para navegar a página
        function goToPage(pageNumber) {
            $('#slider').turn('page', pageNumber);
        }

        // Configuración de los botones superiores
        $('#btn-inicio').on('click', function() { goToPage(1); });
        $('#btn-nosotros').on('click', function() { goToPage(2); });
        $('#btn-reportaje').on('click', function() { goToPage(3); });
        $('#btn-libros').on('click', function() { goToPage(4); });
        $('#btn-contactos').on('click', function() { goToPage(6); }); // ✅ CONFIGURADO PARA PÁGINA 6
        $('#btn-recursos').on('click', function() { goToPage(5); });

        // Configuración de los botones de tarjeta inferiores
        $('#card-inicio').on('click', function() { goToPage(1); });
        $('#card-nosotros').on('click', function() { goToPage(2); });
        $('#card-reportaje').on('click', function() { goToPage(3); });
        $('#card-libros').on('click', function() { goToPage(4); });
        $('#card-contactos').on('click', function() { goToPage(6); }); // ✅ CONFIGURADO PARA PÁGINA 6
        $('#card-recursos').on('click', function() { goToPage(5); });
    });
