<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>Switch 3D game cover slider with GSAP</title>
  <link rel="stylesheet" href="https://public.codepenassets.com/css/normalize-5.0.0.min.css">
  <link rel='stylesheet' href='https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.12.0-2/css/all.min.css'>
  <link rel="stylesheet" href="lib/style.css">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      padding: 24px;
      min-height: 100vh;
      background: linear-gradient(180deg, #d5f0e3, #f5f0e6 50%, #1a3a5f);
      color: #1a3a5f;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      overflow-x: hidden;
      position: relative;
    }

    /* === CONTROLES DEL SLIDER === */
    .ctrl {
      position: absolute;
      color: white;
      background: rgba(0, 0, 0, 0.4);
      border-radius: 50%;
      width: 50px;
      height: 50px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 28px;
      cursor: pointer;
      transition: all 0.3s ease;
      z-index: 100;
    }

    .ctrl:hover {
      background: rgba(0, 0, 0, 0.7);
      transform: scale(1.1);
    }

    .ctrl.left {
      top: 50%;
      left: 20px;
      transform: translateY(-50%);
    }

    .ctrl.right {
      top: 50%;
      right: 20px;
      transform: translateY(-50%);
    }

    /* === ENCABEZADO === */
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 16px;
      margin-bottom: 28px;
    }

    .header-title {
      font-size: 2.3rem;
      font-weight: 700;
      color: #1b5e20;
      margin: 0;
    }

    .nav-buttons {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      justify-content: flex-end;
    }

    .nav-buttons a {
      text-decoration: none;
      padding: 9px 18px;
      background: rgba(255, 255, 255, 0.8);
      color: #1b5e20;
      border: 2px solid #4caf50;
      border-radius: 30px;
      font-weight: 600;
      font-size: 15px;
      transition: all 0.3s ease;
      box-shadow: 0 3px 7px rgba(0, 0, 0, 0.1);
      backdrop-filter: blur(6px);
    }

    .nav-buttons a:hover {
      background: white;
      transform: translateY(-2px);
      box-shadow: 0 6px 16px rgba(0, 0, 0, 0.15);
      border-color: #2196f3;
    }

    .credit {
      text-align: center;
      margin-top: 10px;
      color: #e0e0e0;
      font-size: 0.9rem;
    }
  </style>
</head>

<body>

  <script id="boxTmpl" type="x-tmpl-mustache">
    <div id="{{id}}" class="box" {{{bg}}}>
      <div class="back" {{{bg}}}></div>
      <div class="top"></div>
      <div class="bottom"></div>
      <div class="opening"></div>
      <div class="spine" {{{bg}}}></div>
    </div>
  </script>

  <!-- ✅ Solo botones de los costados -->
  <div id="ctrlLeft" class="ctrl left"><i class="fas fa-angle-left"></i></div>
  <div id="ctrlRight" class="ctrl right"><i class="fas fa-angle-right"></i></div>

  <div id="preloader"></div>

  <div class="header">
    <h1 class="header-title">Conecta Infancia</h1>
    <div class="nav-buttons">
      <a href="index.html"><i class="fas fa-home"></i> Inicio</a>
      <a href="nosotros.html"><i class="fas fa-users"></i> Nosotros</a>
      <a href="REVISTA.html"><i class="fas fa-film"></i> Nota Central</a>
			<a href="notas.html"><i class="fas fa-sticky-note"></i> Notas</a>
      <a href="libro.html"><i class="fas fa-book"></i> Libros</a>
      
      <a href="radio.html"><i class="fas fa-balance-scale"></i> Equilibrio</a>
      <a href="recursos.html"><i class="fas fa-photo-video"></i> Recursos</a>
      <a href="contactos.html"><i class="fas fa-envelope"></i> Contactos</a>
    </div>
  </div>

  <p class="credit">© 2025 Conecta Infancia</p>

  <script src='https://cdnjs.cloudflare.com/ajax/libs/mustache.js/4.0.1/mustache.min.js'></script>
  <script src='https://cdnjs.cloudflare.com/ajax/libs/gsap/3.3.3/gsap.min.js'></script>
  <script src="lib/script.js"></script>

</body>
</html>
